name: CI

on:
  push:
    branches: [master]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test (${{ matrix.cc }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              clang \
              libcriterion-dev \
              pkg-config

      - name: Run tests
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make test

      - name: Build debug libraries
        working-directory: ngutils
        run: make lib

      - name: Build release libraries
        working-directory: ngutils
        run: make librelease

      - name: Upload merged logs (success)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-logs-${{ matrix.cc }}
          path: ngutils/*/logs/result/all.log
          if-no-files-found: ignore

      - name: Upload per-test logs (failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-logs-${{ matrix.cc }}
          path: ngutils/*/logs/log_*.log
          if-no-files-found: ignore

  sanitize:
    name: Sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitize: [ubsan, lsan]

    env:
      CC: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              clang \
              libcriterion-dev \
              pkg-config

      - name: Run with ASan + UBSan
        if: matrix.sanitize == 'ubsan'
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make asan_check

      - name: Run with ASan + LSan
        if: matrix.sanitize == 'lsan'
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make asan_leak

      - name: Upload sanitizer test logs
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: sanitize-logs-${{ matrix.sanitize }}
          path: ngutils/*/logs/result/all.log
          if-no-files-found: ignore

      - name: Upload sanitizer failure logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: sanitize-failure-logs-${{ matrix.sanitize }}
          path: ngutils/*/logs/log_*.log
          if-no-files-found: ignore
