name: CI

on:
  push:
    branches: [master]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test (${{ matrix.cc }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              clang \
              libcriterion-dev \
              pkg-config

      - name: Run tests
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make test

      - name: Build debug libraries
        working-directory: ngutils
        run: make lib

      - name: Build release libraries
        working-directory: ngutils
        run: make librelease

  sanitize:
    name: Sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitize: [ubsan, lsan]

    env:
      CC: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              clang \
              libcriterion-dev \
              pkg-config

      - name: Run with ASan + UBSan
        if: matrix.sanitize == 'ubsan'
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make asan_check

      - name: Run with ASan + LSan
        if: matrix.sanitize == 'lsan'
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make asan_leak

