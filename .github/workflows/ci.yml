name: CI (ngutils)

on:
  push:
    branches: [ master ]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test (${{ matrix.cc }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              clang \
              libcriterion-dev \
              pkg-config

      - name: Build debug libraries
        working-directory: ngutils
        run: make lib

      - name: Run all tests
        working-directory: ngutils
        env:
          REQUIRE_CRITERION: "1"
        run: make test

      - name: Build release libraries
        working-directory: ngutils
        run: make librelease

