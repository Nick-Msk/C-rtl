name: CI (ngutils)

on:
  push:
    branches: [ master ]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'ngutils/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test ngutils
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcriterion-dev pkg-config

      - name: Build and run tests
        working-directory: ngutils
        run: make test

