name: Lint ai-checker

on:
  push:
    branches: [master]
    paths:
      - 'ngutils/ai-checker/**'
      - '.github/workflows/lint-ai.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ngutils/ai-checker/**'
      - '.github/workflows/lint-ai.yml'

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff check
        working-directory: ngutils/ai-checker
        run: uv run ruff check check.py

